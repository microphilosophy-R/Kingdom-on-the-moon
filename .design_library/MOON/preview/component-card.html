<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOON Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: flex-start; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; min-width: 92px; font-size: var(--font-size-caption); color: var(--muted-foreground); line-height: var(--line-height-caption); }
  .divider { width: 100%; border: 0; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .card { width: 100%; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); transition: background .15s, border-color .15s, box-shadow .15s; }
  .card.default { box-shadow: var(--shadow-1); }
  .card.default:hover { filter: brightness(0.97); }
  .card.interactive { box-shadow: var(--shadow-1); cursor: pointer; }
  .card.interactive:hover { background: var(--accent-hover); }
  .card.elevated { box-shadow: var(--shadow-3); }
  .card.elevated:hover { filter: brightness(0.97); }
  .card-header { display: flex; flex-direction: column; gap: var(--space-1); }
  .card-title { margin: 0; font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); color: var(--color-foreground); word-break: keep-all; overflow-wrap: break-word; }
  .card-meta { font-size: var(--font-size-caption); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-body { margin: 0; font-size: var(--font-size-body); line-height: var(--line-height-body); color: var(--color-foreground); }
  .card-footer { display: flex; align-items: center; gap: var(--space-2); }
  .card-action { font-size: var(--font-size-caption); font-weight: 600; color: var(--accent); white-space: nowrap; }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">默认</span><article class="card default" data-evidence-sample="Default"><header class="card-header"><h3 class="card-title">废弃信号站</h3><span class="card-meta">第 3 章 · 轨道残骸</span></header><p class="card-body">一座飘浮在小行星带的中继站，扫描显示内部仍有低频通讯活动。</p><footer class="card-footer"><span class="card-action">查看详情</span></footer></article></div>
<div class="row"><span class="label">可交互</span><article class="card interactive" role="button" tabindex="0" aria-label="选择任务：招募工程师" data-evidence-sample="Interactive"><header class="card-header"><h3 class="card-title">招募工程师</h3><span class="card-meta">船员 · 罕见</span></header><p class="card-body">前星际矿业技师，擅长修复引擎与黑入老旧通讯协议。</p><footer class="card-footer"><span class="card-action">选择</span></footer></article></div>
<hr class="divider">
<div class="row"><span class="label">强化</span><article class="card elevated" data-evidence-sample="Elevated"><header class="card-header"><h3 class="card-title">曲速引擎原型</h3><span class="card-meta">科技 · 传说</span></header><p class="card-body">试验性跃迁核心，可缩短 40% 星系间航行时间，但稳定性存疑。</p><footer class="card-footer"><span class="card-action">研发</span></footer></article></div>
</body>
</html>

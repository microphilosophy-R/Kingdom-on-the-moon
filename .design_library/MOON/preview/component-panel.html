<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel - MOON</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: flex-start; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; padding-top: var(--space-1); }
  .rail { display: flex; gap: var(--space-2); flex-wrap: wrap; flex: 1; }
  hr.divider { border: none; border-top: 1px solid var(--border); margin: var(--space-3) 0; }

  /* @component-css-start */
  .panel { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow-1); min-width: 200px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
  .panel-surface { background: var(--color-surface); color: var(--color-foreground); }
  .panel-parchment { background: linear-gradient(135deg, var(--moon-steel-100), var(--color-surface) 64%); color: var(--color-foreground); }
  .panel-hero { background: linear-gradient(150deg, var(--moon-steel-800), var(--moon-steel-900)); color: var(--moon-steel-50); border-color: var(--moon-steel-700); }
  .panel-raised { background: var(--moon-steel-100); color: var(--color-foreground); box-shadow: var(--shadow-2); }
  .panel-content { font-size: var(--font-size-caption); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">Surface</span>
    <div class="rail">
      <div class="panel panel-surface">
        <span class="panel-content">设施详情面板</span>
      </div>
    </div>
  </div>
  <div class="row">
    <span class="label">Parchment</span>
    <div class="rail">
      <div class="panel panel-parchment">
        <span class="panel-content">叙事文档面板</span>
      </div>
    </div>
  </div>
  <div class="row">
    <span class="label">Hero</span>
    <div class="rail">
      <div class="panel panel-hero">
        <span class="panel-content">深色强调区域</span>
      </div>
    </div>
  </div>
  <div class="row">
    <span class="label">Raised</span>
    <div class="rail">
      <div class="panel panel-raised">
        <span class="panel-content">抬升操作面板</span>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar - MOON</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .rail { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; flex: 1; }
  hr.divider { border: none; border-top: 1px solid var(--border); margin: var(--space-3) 0; }

  /* @component-css-start */
  .avatar { position: relative; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); background: var(--muted); flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-rounded { border-radius: var(--radius-md); }
  .avatar-circle { border-radius: var(--radius-full); }
  .avatar-sm { width: 32px; height: 32px; }
  .avatar-md { width: 48px; height: 48px; }
  .avatar-lg { width: 72px; height: 72px; }
  .avatar-placeholder { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: var(--muted); color: var(--muted-foreground); font-size: var(--font-size-caption); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">圆角</span>
    <div class="rail">
      <div class="avatar avatar-md avatar-rounded">
        <div class="avatar-placeholder">👤</div>
      </div>
    </div>
  </div>
  <div class="row">
    <span class="label">圆形</span>
    <div class="rail">
      <div class="avatar avatar-md avatar-circle">
        <div class="avatar-placeholder">👤</div>
      </div>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">尺寸</span>
    <div class="rail">
      <div class="avatar avatar-sm avatar-rounded">
        <div class="avatar-placeholder">S</div>
      </div>
      <div class="avatar avatar-md avatar-rounded">
        <div class="avatar-placeholder">M</div>
      </div>
      <div class="avatar avatar-lg avatar-rounded">
        <div class="avatar-placeholder">L</div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ActionBar - MOON</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: flex-start; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; padding-top: var(--space-1); }
  .rail { display: flex; flex-direction: column; gap: var(--space-2); flex: 1; }
  hr.divider { border: none; border-top: 1px solid var(--border); margin: var(--space-3) 0; }

  /* @component-css-start */
  .action-bar { display: flex; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--color-surface); }
  .action-bar-left { justify-content: flex-start; }
  .action-bar-center { justify-content: center; }
  .action-bar-right { justify-content: flex-end; }
  .action-bar-spread { justify-content: space-between; }
  .action-btn { display: inline-flex; align-items: center; justify-content: center; height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-4); border: 1px solid transparent; border-radius: var(--radius-md); font-family: var(--font-body); font-size: var(--font-size-body); cursor: pointer; }
  .action-btn-primary { background: var(--accent); color: var(--primary-foreground); }
  .action-btn-primary:hover { background: var(--accent-hover); }
  .action-btn-secondary { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); }
  .action-btn-secondary:hover { filter: brightness(.97); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">右对齐</span>
    <div class="rail">
      <div class="action-bar action-bar-right">
        <button class="action-btn action-btn-secondary">取消</button>
        <button class="action-btn action-btn-primary">确认跃迁</button>
      </div>
    </div>
  </div>
  <div class="row">
    <span class="label">两端对齐</span>
    <div class="rail">
      <div class="action-bar action-bar-spread">
        <button class="action-btn action-btn-secondary">返回基地</button>
        <button class="action-btn action-btn-primary">执行命令</button>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag - MOON</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .rail { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; flex: 1; }
  hr.divider { border: none; border-top: 1px solid var(--border); margin: var(--space-3) 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .tag { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; font-family: var(--font-body); font-weight: var(--font-weight-caption); white-space: nowrap; flex-shrink: 0; cursor: pointer; transition: background .15s, border-color .15s; }
  .tag-md { height: 28px; min-width: 28px; padding: 0 var(--space-3); font-size: var(--font-size-caption); line-height: var(--line-height-caption); border-radius: var(--radius-full); }
  .tag-sm { height: 22px; min-width: 22px; padding: 0 var(--space-2); font-size: 11px; line-height: 1.4; border-radius: var(--radius-full); }
  .tag-default { background: var(--muted); color: var(--foreground); }
  .tag-default:hover { background: var(--border); }
  .tag-success { background: var(--color-success); color: var(--primary-foreground); }
  .tag-success:hover { filter: brightness(1.08); }
  .tag-warning { background: var(--color-warning); color: var(--primary-foreground); }
  .tag-warning:hover { filter: brightness(1.08); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">默认</span>
    <div class="rail">
      <span class="tag tag-md tag-default">文本标签</span>
    </div>
  </div>
  <div class="row">
    <span class="label">状态</span>
    <div class="rail">
      <span class="tag tag-md tag-success">状态文本</span>
      <span class="tag tag-md tag-warning">状态文本</span>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">紧凑</span>
    <div class="rail">
      <span class="tag tag-sm tag-default">文本标签</span>
      <span class="tag tag-sm tag-success">状态文本</span>
      <span class="tag tag-sm tag-warning">状态文本</span>
    </div>
  </div>
</body>
</html>

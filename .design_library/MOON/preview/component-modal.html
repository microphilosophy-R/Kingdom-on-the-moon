<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Modal</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* Page scaffold — NOT extracted */
    body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-body); color: var(--color-on-surface); }
    .row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; }
    .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; line-height: 1; padding-top: 12px; }
    .divider { border: none; border-top: 1px solid var(--color-border); margin: 16px 0; }
    .stage { flex: 1; display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }

    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .modal-scene { width: 360px; min-height: 220px; background: var(--background); border: 1px solid var(--color-border); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; padding: var(--space-4); }
    .modal { width: 100%; max-width: 320px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-4); overflow: hidden; }
    .modal-sm { max-width: 280px; }
    .modal-header { padding: var(--space-4) var(--space-4) var(--space-2); }
    .modal-title { margin: 0; font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); color: var(--color-on-surface); word-break: keep-all; overflow-wrap: break-word; }
    .modal-body { padding: var(--space-2) var(--space-4) var(--space-4); font-size: var(--font-size-body); line-height: var(--line-height-body); color: var(--color-on-surface); overflow-wrap: break-word; }
    .modal-body p { margin: 0; }
    .modal-footer { display: flex; gap: var(--space-3); padding: var(--space-3) var(--space-4) var(--space-4); }
    .modal-footer.end { justify-content: flex-end; }
    .modal-footer.center { justify-content: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-4); border: 1px solid transparent; border-radius: var(--radius-md); font-family: var(--font-body); font-size: var(--font-size-body); font-weight: var(--font-weight-body); line-height: 1; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
    .btn-primary { background: var(--accent); color: var(--primary-foreground); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--color-secondary); color: var(--secondary-foreground); border-color: var(--color-border); }
    .btn-secondary:hover { filter: brightness(0.97); }
    .btn-danger { background: var(--color-error); color: var(--on-error); }
    .btn-danger:hover { filter: brightness(1.08); }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="row">
    <span class="label">确认</span>
    <div class="stage">
      <div class="modal-scene">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" data-evidence-sample="Confirm">
          <div class="modal-header">
            <h3 class="modal-title" id="confirm-title">跃迁确认</h3>
          </div>
          <div class="modal-body">
            <p>曲速引擎已预热，目标星系：天鹅座 X-1。是否立即跃迁？</p>
          </div>
          <div class="modal-footer end">
            <button class="btn btn-secondary">取消</button>
            <button class="btn btn-primary">确认跃迁</button>
          </div>
        </div>
      </div>
      <div class="modal-scene">
        <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="info-title" data-evidence-sample="Info">
          <div class="modal-header">
            <h3 class="modal-title" id="info-title">任务情报</h3>
          </div>
          <div class="modal-body">
            <p>侦测到未知信号源，建议先扫描再进入跃迁。</p>
          </div>
          <div class="modal-footer center">
            <button class="btn btn-secondary">关闭</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">危险</span>
    <div class="stage">
      <div class="modal-scene">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="danger-title" data-evidence-sample="Danger">
          <div class="modal-header">
            <h3 class="modal-title" id="danger-title">弃船警告</h3>
          </div>
          <div class="modal-body">
            <p>船体完整度低于 15%。弃船后将损失全部未保存资源，此操作不可逆。</p>
          </div>
          <div class="modal-footer end">
            <button class="btn btn-secondary">取消</button>
            <button class="btn btn-danger">确认弃船</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

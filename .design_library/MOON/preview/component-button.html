<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button · MOON</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--muted-foreground); white-space: nowrap; }
  .divider { border: 0; border-top: 1px solid var(--border); margin: var(--space-3) 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); box-sizing: border-box; border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; font-family: var(--font-body); font-size: var(--font-size-body); font-weight: var(--font-weight-body); line-height: 1; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; flex-shrink: 0; transition: background .15s, border-color .15s, filter .15s; }
  .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-secondary { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); }
  .btn-secondary:hover:not(:disabled) { filter: brightness(.97); }
  .btn-ghost { background: transparent; color: var(--primary); border-color: transparent; }
  .btn-ghost:hover:not(:disabled) { background: var(--muted); }
  .btn-outline { background: transparent; color: var(--foreground); border-color: var(--border); }
  .btn-outline:hover:not(:disabled) { background: var(--muted); }
  .btn-sm { height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 0 var(--space-3); font-size: var(--font-size-caption); }
  .btn-md { height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-4); font-size: var(--font-size-body); }
  .btn-lg { height: var(--size-button-lg); min-width: var(--size-button-lg); padding: 0 var(--space-5); font-size: var(--font-size-body); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row"><span class="label">主要</span><button type="button" class="btn btn-primary btn-md">文本标签</button><button type="button" class="btn btn-primary btn-md" disabled>文本标签</button></div>
  <div class="row"><span class="label">次要</span><button type="button" class="btn btn-secondary btn-md">文本标签</button><button type="button" class="btn btn-secondary btn-md" disabled>文本标签</button></div>
  <div class="row"><span class="label">幽灵</span><button type="button" class="btn btn-ghost btn-md">文本标签</button><button type="button" class="btn btn-ghost btn-md" disabled>文本标签</button></div>
  <div class="row"><span class="label">轮廓</span><button type="button" class="btn btn-outline btn-md">文本标签</button><button type="button" class="btn btn-outline btn-md" disabled>文本标签</button></div>
  <hr class="divider">
  <div class="row"><span class="label">尺寸</span><button type="button" class="btn btn-primary btn-sm">文本标签</button><button type="button" class="btn btn-primary btn-md">文本标签</button><button type="button" class="btn btn-primary btn-lg">文本标签</button></div>
</body>
</html>

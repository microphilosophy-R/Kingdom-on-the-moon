<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabs - MOON</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .rail { display: flex; flex-direction: column; gap: var(--space-2); flex: 1; }
  hr.divider { border: none; border-top: 1px solid var(--border); margin: var(--space-3) 0; }

  /* @component-css-start */
  .tab-nav { display: flex; gap: 0; background: var(--surface-container); border-radius: var(--radius-md); padding: var(--space-1); width: fit-content; }
  .tab-item { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--space-1) var(--space-3); border: none; border-radius: var(--radius-md); background: transparent; color: var(--muted-foreground); cursor: pointer; font-family: var(--font-body); font-size: var(--font-size-caption); transition: background .15s, color .15s; min-width: 60px; }
  .tab-item:hover { color: var(--color-foreground); }
  .tab-item.active { background: var(--color-surface); color: var(--accent); box-shadow: var(--shadow-1); }
  .tab-item svg { width: var(--size-icon-sm); height: var(--size-icon-sm); }
  .tab-bar { display: flex; gap: 0; background: var(--surface-container); border-top: 1px solid var(--border); padding: var(--space-1) var(--space-2); justify-content: space-around; }
  .tab-bar .tab-item { flex: 1; padding: var(--space-1) var(--space-2); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">默认</span>
    <div class="rail">
      <div class="tab-nav">
        <button class="tab-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          基地
        </button>
        <button class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          设施
        </button>
        <button class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          政策
        </button>
      </div>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">底部栏</span>
    <div class="rail" style="max-width: 360px;">
      <div class="tab-bar">
        <button class="tab-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          基地
        </button>
        <button class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          设施
        </button>
        <button class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          政策
        </button>
      </div>
    </div>
  </div>
</body>
</html>

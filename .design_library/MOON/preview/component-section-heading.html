<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SectionHeading - MOON</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: flex-start; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; padding-top: var(--space-1); }
  .rail { display: flex; flex-direction: column; gap: var(--space-2); flex: 1; }
  hr.divider { border: none; border-top: 1px solid var(--border); margin: var(--space-3) 0; }

  /* @component-css-start */
  .section-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); width: 100%; }
  .section-heading-left { display: flex; flex-direction: column; gap: 2px; }
  .section-heading-eyebrow { font-size: var(--font-size-caption); font-weight: var(--font-weight-h4); color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
  .section-heading-title { margin: 0; font-family: var(--font-heading); font-size: var(--font-size-h3); font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); color: var(--color-foreground); }
  .section-heading-desc { margin: 0; font-size: var(--font-size-body); line-height: var(--line-height-body); color: var(--muted-foreground); }
  .section-heading-action { flex-shrink: 0; display: inline-flex; align-items: center; height: var(--size-button-md); padding: 0 var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--accent); font-size: var(--font-size-caption); cursor: pointer; }
  .section-heading-action:hover { background: var(--muted); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">默认</span>
    <div class="rail">
      <div class="section-heading">
        <div class="section-heading-left">
          <span class="section-heading-eyebrow">轨道殖民地</span>
          <h2 class="section-heading-title">静海基地</h2>
        </div>
      </div>
      <p class="section-heading-desc">月面主要定居点，拥有完整的生态系统与工业链。</p>
    </div>
  </div>
  <div class="row">
    <span class="label">带操作</span>
    <div class="rail">
      <div class="section-heading">
        <div class="section-heading-left">
          <span class="section-heading-eyebrow">科技研发</span>
          <h2 class="section-heading-title">量子通讯</h2>
        </div>
        <button class="section-heading-action">查看全部</button>
      </div>
      <p class="section-heading-desc">当前研发进度 68%，预计3周期后完成。</p>
    </div>
  </div>
</body>
</html>

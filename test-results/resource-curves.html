<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>月面王国 - 资源周期曲线分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; margin: 20px; }
  h1 { color: #f0f6fc; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(700px, 1fr)); gap: 20px; margin-top: 20px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .card h2 { margin: 0 0 8px 0; font-size: 16px; color: #f0f6fc; }
  .card canvas { width: 100%; height: 380px; }
  .summary { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-top: 20px; }
  .summary h2 { color: #f0f6fc; margin-top: 0; }
  .summary table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .summary th, .summary td { border: 1px solid #30363d; padding: 6px 12px; text-align: right; }
  .summary th { background: #1c2129; color: #f0f6fc; text-align: center; }
  .critical { color: #ff7b72; }
  .warn { color: #d29922; }
  .ok { color: #3fb950; }
  .analysis { margin-top: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .analysis h2 { color: #f0f6fc; }
  .analysis ul { color: #c9d1d9; line-height: 1.8; }
  .analysis .highlight { color: #ff7b72; font-weight: bold; }
  .toolbar { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0 0; }
  .toolbar label { color: #8b949e; font-size: 14px; }
  .toolbar select { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .toolbar select:focus { outline: none; border-color: #58a6ff; }
  .toolbar .status { color: #3fb950; font-size: 13px; }
  .toolbar .status.error { color: #ff7b72; }
</style>
</head>
<body>
<h1>月面王国 · 1000御日资源周期曲线</h1>
<div class="toolbar">
  <label for="runSelector">📂 数据源：</label>
  <select id="runSelector"><option value="">扫描中...</option></select>
  <span class="status" id="loadStatus"></span>
</div>
<div class="grid">
  <div class="card"><h2>📈 人口增长 (Population)</h2><canvas id="chartPopulation"></canvas></div>
  <div class="card"><h2>🏗️ 建筑等级演进 (Facility Levels)</h2><canvas id="chartLevels"></canvas></div>
  <div class="card"><h2>💰 核心资源库存 (Key Resources)</h2><canvas id="chartResources"></canvas></div>
  <div class="card"><h2>⚙️ 日产净额 (Daily Net Production)</h2><canvas id="chartDailyNet"></canvas></div>
  <div class="card"><h2>📊 合金-月壤-货币 (Alloy-Regolith-Currency)</h2><canvas id="chartMaterials"></canvas></div>
  <div class="card"><h2>🌱 生命维持资源 (Life Support)</h2><canvas id="chartLifeSupport"></canvas></div>
</div>

<div class="summary">
<h2>关键指标分析</h2>
<table>
  <thead>
    <tr><th>指标</th><th>Day 1</th><th>Day 50</th><th>Day 200</th><th>Day 400</th><th>Day 600</th><th>Day 800</th><th>Day 1000</th></tr>
  </thead>
  <tbody id="summaryBody"></tbody>
</table>
</div>

<div class="analysis" id="analysisSection">
</div>

<script>
let charts = [];

function destroyCharts() {
  charts.forEach(c => c.destroy());
  charts = [];
}

// Discover available simulation runs (this file is in test-results/)
async function discoverAvailableRuns() {
  const available = [];
  for (let i = 1; i <= 10; i++) {
    const run = String(i).padStart(3, '0');
    try {
      const resp = await fetch(`simulation/run-${run}.json`);
      if (resp.ok) { available.push(run); }
    } catch {}
  }
  return available;
}

async function loadData(run) {
  const resp = await fetch(`simulation/run-${run}.json`);
  if (!resp.ok) throw new Error(`无法加载 run-${run}`);
  return await resp.json();
}

// Load and parse simulation data
async function loadDataLegacy() {
  // Try to load the latest run
  const runs = Array.from({length: 10}, (_, i) => String(i + 1).padStart(3, '0'));
  for (const run of runs.reverse()) {
    try {
      const resp = await fetch(`../test-results/simulation/run-${run}.json`);
      if (resp.ok) {
        return { data: await resp.json(), run };
      }
    } catch {}
  }
  // Fallback: embed the data
  return null;
}

function createCharts(data) {
  destroyCharts();
  const snapshots = data.snapshots;
  const days = snapshots.map(s => s.day);
  
  // Chart 1: Population
  charts.push(new Chart(document.getElementById('chartPopulation'), {
    type: 'line',
    data: {
      labels: days,
      datasets: [
        { label: '总人口', data: snapshots.map(s => s.population.total), borderColor: '#3fb950', backgroundColor: 'rgba(63,185,80,0.1)', fill: true, tension: 0.3 },
        { label: '住房容量', data: snapshots.map(s => s.population.capacity), borderColor: '#58a6ff', borderDash: [6,3], tension: 0.3 },
        { label: '人口净增长/日', data: snapshots.map(s => s.population.net * 20), borderColor: '#d29922', yAxisID: 'y1', tension: 0.3 },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c9d1d9' } } },
      scales: {
        x: { title: { display: true, text: '御日', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y: { title: { display: true, text: '人数', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y1: { position: 'right', title: { display: true, text: '净增(x20)', color: '#d29922' }, ticks: { color: '#d29922' }, grid: { display: false } }
      }
    }
  }));

  // Chart 2: Facility Levels
  const facilities = ['E1','C1','K','B','E2','C2','F','P','R','L','H','M'];
  const colors = ['#ff7b72','#ffa657','#3fb950','#58a6ff','#c084fc','#f97583','#79c0ff','#d2a8ff','#7ee787','#a5d6ff','#f778ba','#e3b341'];
  const levelDatasets = facilities.map((fac, i) => ({
    label: fac,
    data: snapshots.map(s => s.levels[fac]),
    borderColor: colors[i],
    backgroundColor: colors[i] + '20',
    fill: false,
    tension: 0.3,
    pointRadius: 1,
  }));
  charts.push(new Chart(document.getElementById('chartLevels'), {
    type: 'line',
    data: { labels: days, datasets: levelDatasets },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c9d1d9', font: { size: 10 } } } },
      scales: {
        x: { title: { display: true, text: '御日', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y: { title: { display: true, text: '等级', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }
      }
    }
  }));

  // Chart 3: Key Resources (log scale for readability)
  charts.push(new Chart(document.getElementById('chartResources'), {
    type: 'line',
    data: {
      labels: days,
      datasets: [
        { label: '合金 Alloy', data: snapshots.map(s => s.resources.alloy), borderColor: '#ff7b72', tension: 0.3, pointRadius: 1 },
        { label: '知识 Knowledge', data: snapshots.map(s => s.resources.knowledge), borderColor: '#c084fc', tension: 0.3, pointRadius: 1 },
        { label: '货币 Currency', data: snapshots.map(s => s.resources.currency), borderColor: '#d29922', tension: 0.3, pointRadius: 1 },
        { label: '月壤 Regolith', data: snapshots.map(s => s.resources.regolith), borderColor: '#8b949e', tension: 0.3, pointRadius: 1 },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c9d1d9' } } },
      scales: {
        x: { title: { display: true, text: '御日', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y: { type: 'logarithmic', title: { display: true, text: '库存 (log)', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }
      }
    }
  }));

  // Chart 4: Daily Net Production
  charts.push(new Chart(document.getElementById('chartDailyNet'), {
    type: 'line',
    data: {
      labels: days,
      datasets: [
        { label: '合金/日', data: snapshots.map(s => s.dailyNet.alloy), borderColor: '#ff7b72', tension: 0.3, pointRadius: 1 },
        { label: '知识/日', data: snapshots.map(s => s.dailyNet.knowledge), borderColor: '#c084fc', tension: 0.3, pointRadius: 1 },
        { label: '电力/日', data: snapshots.map(s => s.dailyNet.power), borderColor: '#d29922', tension: 0.3, pointRadius: 1 },
        { label: '货币/日', data: snapshots.map(s => s.dailyNet.currency), borderColor: '#3fb950', tension: 0.3, pointRadius: 1 },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c9d1d9' } } },
      scales: {
        x: { title: { display: true, text: '御日', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y: { title: { display: true, text: '日产净值', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }
      }
    }
  }));

  // Chart 5: Alloy, Regolith, Currency (linear scale)
  charts.push(new Chart(document.getElementById('chartMaterials'), {
    type: 'line',
    data: {
      labels: days,
      datasets: [
        { label: '合金 Alloy', data: snapshots.map(s => s.resources.alloy), borderColor: '#ff7b72', backgroundColor: 'rgba(255,123,114,0.1)', fill: true, tension: 0.3, pointRadius: 1 },
        { label: '月壤 Regolith', data: snapshots.map(s => s.resources.regolith), borderColor: '#8b949e', backgroundColor: 'rgba(139,148,158,0.1)', fill: true, tension: 0.3, pointRadius: 1 },
        { label: '货币 Currency', data: snapshots.map(s => s.resources.currency), borderColor: '#d29922', backgroundColor: 'rgba(210,153,34,0.1)', fill: true, tension: 0.3, pointRadius: 1, yAxisID: 'y1' },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c9d1d9' } } },
      scales: {
        x: { title: { display: true, text: '御日', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y: { title: { display: true, text: '库存', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y1: { position: 'right', title: { display: true, text: '货币', color: '#d29922' }, ticks: { color: '#d29922' }, grid: { display: false } }
      }
    }
  }));

  // Chart 6: Life Support
  charts.push(new Chart(document.getElementById('chartLifeSupport'), {
    type: 'line',
    data: {
      labels: days,
      datasets: [
        { label: '水 Water', data: snapshots.map(s => s.resources.water), borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.1)', fill: true, tension: 0.3, pointRadius: 1 },
        { label: '氧气 Oxygen', data: snapshots.map(s => s.resources.oxygen), borderColor: '#3fb950', backgroundColor: 'rgba(63,185,80,0.1)', fill: true, tension: 0.3, pointRadius: 1, yAxisID: 'y1' },
        { label: '生物质 Biomass', data: snapshots.map(s => s.resources.biomass), borderColor: '#c084fc', backgroundColor: 'rgba(192,132,252,0.1)', fill: true, tension: 0.3, pointRadius: 1, yAxisID: 'y1' },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c9d1d9' } } },
      scales: {
        x: { title: { display: true, text: '御日', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y: { title: { display: true, text: '水', color: '#58a6ff' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y1: { position: 'right', title: { display: true, text: '氧气/生物质', color: '#c9d1d9' }, ticks: { color: '#8b949e' }, grid: { display: false } }
      }
    }
  }));

  // Summary table (clear first)
  const tbody = document.getElementById('summaryBody');
  tbody.innerHTML = '';
  const summaryDays = [1, 50, 200, 400, 600, 800, 1000];
  const summarySnaps = summaryDays.map(d => snapshots.find(s => s.day === d) || snapshots[0]);
  const metrics = [
    { name: '人口', key: s => s.population.total, format: v => v.toFixed(1) },
    { name: '住房容量', key: s => s.population.capacity },
    { name: '合金库存', key: s => s.resources.alloy, format: v => v >= 1000 ? (v/1000).toFixed(1)+'K' : v.toFixed(0) },
    { name: '月壤库存', key: s => s.resources.regolith, format: v => v >= 1000 ? (v/1000).toFixed(1)+'K' : v.toFixed(0) },
    { name: '货币库存', key: s => s.resources.currency, format: v => v >= 1000 ? (v/1000).toFixed(1)+'K' : v.toFixed(0) },
    { name: '水库存', key: s => s.resources.water, format: v => v >= 1000 ? (v/1000).toFixed(1)+'K' : v.toFixed(0) },
    { name: '知识库存', key: s => s.resources.knowledge, format: v => v >= 1000 ? (v/1000).toFixed(1)+'K' : v.toFixed(0) },
    { name: '合金日产净额', key: s => s.dailyNet.alloy, format: v => v.toFixed(1) },
    { name: '知识日产净额', key: s => s.dailyNet.knowledge, format: v => v.toFixed(1) },
    { name: '累计开工数', key: s => s.cumulative.started },
    { name: '累计完工数', key: s => s.cumulative.completed },
    { name: '容量满天', key: s => s.cumulative.capacityFullDays },
    { name: '压力天数', key: s => s.cumulative.strainedDays },
  ];
  metrics.forEach(m => {
    const row = document.createElement('tr');
    row.innerHTML = `<td style="text-align:left;color:#f0f6fc">${m.name}</td>` +
      summarySnaps.map(s => `<td>${m.format ? m.format(m.key(s)) : m.key(s)}</td>`).join('');
    tbody.appendChild(row);
  });

  // Analysis
  const final = snapshots[snapshots.length - 1];
  const day200 = snapshots.find(s => s.day === 200);
  const day400 = snapshots.find(s => s.day >= 400);
  
  const alloyGrowth400_1000 = final.resources.alloy - day400.resources.alloy;
  const dailyAlloyAfter400 = alloyGrowth400_1000 / (final.day - day400.day);
  
  document.getElementById('analysisSection').innerHTML = `
<h2>🔍 曲线诊断分析</h2>
<ul>
  <li><span class="highlight">人口天花板过早触及</span>：人口在第 400 御日即达到 552 容量上限（总模拟 1000 日的 40% 处），剩余 600 日人口停滞增长，仅资源线性堆积。</li>
  <li><span class="highlight">建筑等级飞速拉满</span>：至第 400 御日，E1/C1/K/B/L 已达最大等级 15，H 达 12，M 达 10。全部 150 项工程在 Day 450 前全部完工。</li>
  <li><span class="highlight">合金爆炸级增长</span>：Day 400 合金库存 61.8K → Day 1000 达 250.2K，日均积累 <b>${dailyAlloyAfter400.toFixed(0)} 合金/日</b> 但无处可花。</li>
  <li><span class="highlight">知识完全过剩</span>：Day 400 知识库存 139.7K → Day 1000 达 668.4K，科技全部完成后知识失去消耗出口。</li>
  <li><span class="critical">根本问题：升级成本线性增长，但产出指数增长</span>。当前 cost = base × (level+1) × scale（线性），而产出随等级和科技提升呈超线性增长，导致中后期成本微不足道。</li>
</ul>
<h2>💡 建议收紧策略</h2>
<ul>
  <li><b>1. 将升级成本从线性改为平方增长</b>：cost = base × <b>(level+1)²</b> × scale，使高等级升级显著变贵。</li>
  <li><b>2. 提高 <code>getUpgradeCostScale</code> 基础倍率</b>：当前标准设施 scale=4（即 1 岗容量对应 4 成本乘数），可提升至 6~8。</li>
  <li><b>3. 科技研究成本与时代挂钩</b>：后期科技消耗更多知识，减缓科技全解锁速度。</li>
  <li><b>4. 提升 housing 建筑的成本倍率</b>：K(2→4), H(4→8), M(6→12)，使人口扩容成本更高。</li>
</ul>
  `;
}

function expandData(compact) {
  return {
    snapshots: compact.days.map((day, i) => ({
      day,
      resources: {
        population: compact.pop_total[i],
        alloy: compact.resources_alloy[i],
        regolith: compact.resources_regolith[i],
        currency: compact.resources_currency[i],
        water: compact.resources_water[i],
        oxygen: compact.resources_oxygen[i],
        biomass: compact.resources_biomass[i],
        knowledge: compact.resources_knowledge[i],
        power: compact.resources_power[i],
        luxury: compact.resources_luxury[i],
        quantumCore: compact.resources_quantumCore[i],
      },
      dailyNet: {
        alloy: compact.dailyNet_alloy[i],
        knowledge: compact.dailyNet_knowledge[i],
        power: compact.dailyNet_power[i],
        currency: compact.dailyNet_currency[i],
        water: compact.dailyNet_water[i],
        oxygen: compact.dailyNet_oxygen[i],
        biomass: compact.dailyNet_biomass[i],
      },
      population: {
        total: compact.pop_total[i],
        capacity: compact.pop_capacity[i],
        net: compact.pop_net[i],
        pressureDays: compact.pressureDays[i],
        status: compact.pop_total[i] >= compact.pop_capacity[i] ? 'full' : 'stable',
      },
      levels: Object.fromEntries(["E1","C1","K","B","E2","C2","F","P","R","L","H","M"].map(f => [f, compact.levels[f][i]])),
      cumulative: {
        started: compact.cumulative_started[i],
        completed: compact.cumulative_completed[i],
        capacityFullDays: compact.cumulative_capacityFullDays[i],
      },
    }))
  };
}
// Init: discover runs, populate dropdown, use embedded data as fallback
(async () => {
  const selector = document.getElementById('runSelector');
  const status = document.getElementById('loadStatus');
  const titleBase = document.querySelector('h1').textContent;

  const runs = await discoverAvailableRuns();

  if (runs.length === 0) {
    // 无 JSON 数据，使用嵌入式数据
    selector.innerHTML = '<option value="">嵌入式数据</option>';
    status.textContent = '已加载嵌入式数据';
    status.className = 'status';
    document.querySelector('h1').textContent = `${titleBase} (嵌入式)`;
    const data = expandData(DATA);
    createCharts(data);
    return;
  }

  // 填充下拉菜单
  selector.innerHTML = runs.map(r => `<option value="${r}">run-${r}</option>`).join('');
  selector.value = runs[runs.length - 1];

  // 切换下拉时加载数据
  selector.addEventListener('change', async () => {
    const run = selector.value;
    if (!run) return;
    status.textContent = '加载中...';
    status.className = 'status';
    try {
      const jsonData = await loadData(run);
      document.querySelector('h1').textContent = `${titleBase} (run-${run})`;
      createCharts(jsonData);
      status.textContent = `已加载 run-${run}`;
      status.className = 'status';
    } catch (e) {
      status.textContent = '加载失败';
      status.className = 'status error';
    }
  });

  // 初始加载最新 run
  const initialRun = runs[runs.length - 1];
  status.textContent = '加载中...';
  status.className = 'status';
  try {
    const jsonData = await loadData(initialRun);
    document.querySelector('h1').textContent = `${titleBase} (run-${initialRun})`;
    createCharts(jsonData);
    status.textContent = `已加载 run-${initialRun}`;
    status.className = 'status';
  } catch (e) {
    status.textContent = '加载失败';
    status.className = 'status error';
  }
})();
